name: ZERMP Enterprise CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  code-quality:
    name: Code Quality & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linting & Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy bandit[toml] pip-audit -r requirements.txt

      - name: Ruff Linter
        run: |
          ruff check src/ --ignore E501,F401,F841 || true

      - name: Bandit Security SAST
        run: |
          bandit -r src/ -ll -ii -s B101,B507

  unit-tests:
    name: Unit Tests & Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Runtime & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Unit Tests
        env:
          PYTHONPATH: .
          APP_ENV: test
          SECRET_KEY: test-secret-key-for-ci-pipeline-only
        run: |
          pytest tests/ -v
