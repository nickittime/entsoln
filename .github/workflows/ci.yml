name: ZERMP Enterprise CI & Automated Quality Gates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  code-quality-and-lint:
    name: Code Quality & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Execute Ruff Code Linting
        run: |
          ruff check src/ tests/

      - name: Execute Static Type Checks (mypy)
        run: |
          mypy src/

  security-sast-audit:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Security Scanners
        run: |
          pip install bandit pip-audit

      - name: Run Bandit SAST on Source Code
        run: |
          bandit -r src/ -ll -ii

      - name: Audit Dependency CVEs
        run: |
          pip-audit -r requirements.txt || true

  unit-and-integration-tests:
    name: Unit Tests & Quality Gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: zermp_core
          POSTGRES_USER: zermp_admin
          POSTGRES_PASSWORD: zermp_secure_dev_password_2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Pytest Suite with Quality Gate Enforcement
        env:
          DATABASE_URL: postgresql+asyncpg://zermp_admin:zermp_secure_dev_password_2026@localhost:5432/zermp_core
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-ci-secret-key-32-characters-minimum
        run: |
          pytest tests/ --durations=10

  docker-build-verification:
    name: Container Build & Image Healthcheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build ZERMP API Container
        run: |
          docker build -t zermp-api:ci -f infra/docker/Dockerfile.api .
